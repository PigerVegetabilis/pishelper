<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Тренажёр ПИС</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: одна колонка, один вопрос за раз; сверху полоса настроек, внизу карточка вопроса с четырьмя типами ответов. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --fg:#17202a; --muted:#5a6672; --line:#d3dae1;
  --accent:#1f6f6b; --accent-fg:#ffffff; --accent-soft:#dff0ee;
  --ok:#17794a; --ok-bg:#dcf3e6; --bad:#b3261e; --bad-bg:#fbe2df; --miss:#8a5a00; --miss-bg:#fff0cf;
  --font:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1517; --surface:#162024; --fg:#e6edf0; --muted:#93a1a9; --line:#2a373d;
  --accent:#58c2b9; --accent-fg:#0b1517; --accent-soft:#1a3636;
  --ok:#6fdca2; --ok-bg:#12372a; --bad:#ff8f86; --bad-bg:#432024; --miss:#f2c96b; --miss-bg:#3d3112; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1517; --surface:#162024; --fg:#e6edf0; --muted:#93a1a9; --line:#2a373d;
  --accent:#58c2b9; --accent-fg:#0b1517; --accent-soft:#1a3636;
  --ok:#6fdca2; --ok-bg:#12372a; --bad:#ff8f86; --bad-bg:#432024; --miss:#f2c96b; --miss-bg:#3d3112; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:24px}
.wrap{max-width:740px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.5rem;line-height:1.2;margin:0;text-wrap:balance;font-weight:600}
.sub{color:var(--muted);margin:4px 0 0;font-size:.9rem}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0;flex:1 1 170px}
select{font:inherit;font-size:.95rem;text-transform:none;letter-spacing:0;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;min-width:0;width:100%}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:6px;padding:10px 18px;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:.8rem;color:var(--muted);margin:8px 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:16px}
.tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.topic{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.type{font-size:.72rem;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.q{font-size:1.12rem;line-height:1.4;font-weight:500;margin:0;text-wrap:pretty}
.fig{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;overflow-x:auto}
.fig.raster{background:#fff}
.fig img{display:block;margin-inline:auto;max-width:100%;height:auto}
.fig svg{display:block;margin-inline:auto;max-width:100%;height:auto}
.fig .bx{fill:var(--surface);stroke:var(--fg);stroke-width:2}
.fig .ln{fill:none;stroke:var(--fg);stroke-width:3}
.fig .th{fill:none;stroke:var(--fg);stroke-width:1.5}
.fig text{fill:var(--fg);font-family:var(--font);font-size:15px;font-weight:600}
.fig .dot{fill:var(--fg)}
.fig .ar{fill:var(--fg)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.opt .k{font-family:var(--mono);font-size:.85rem;color:var(--muted);flex:none;width:1.4em;padding-top:1px}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.ok .k{color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt.bad .k{color:var(--bad)}
.opt.miss{background:var(--miss-bg);border-color:var(--miss)}
.opt.miss .k{color:var(--miss)}
.box{flex:none;width:18px;height:18px;border:2px solid var(--muted);border-radius:4px;margin-top:2px;display:grid;place-items:center;font-size:13px;line-height:1}
.opt.sel .box{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
.rows{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,15rem);gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.mrow .l{min-width:0;overflow-wrap:anywhere}
.mrow.ok{background:var(--ok-bg);border-color:var(--ok)}
.mrow.bad{background:var(--bad-bg);border-color:var(--bad)}
.mrow .fix{grid-column:1/-1;font-size:.85rem;color:var(--muted)}
@media (max-width:520px){.mrow{grid-template-columns:minmax(0,1fr)}}
.note{font-size:.9rem;color:var(--muted);border-left:3px solid var(--line);padding-left:12px;margin:0}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.verdict{font-weight:600}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.score{font-size:2.4rem;font-weight:600;font-family:var(--mono);line-height:1}
.wrong{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.wrong li{border-top:1px solid var(--line);padding-top:12px;font-size:.95rem;overflow-wrap:anywhere}
.wrong b{color:var(--ok);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap}
.view{display:flex;flex-direction:column;gap:16px}
.view[hidden]{display:none}
.examlink{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px}
.rules{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:6px}
.xhead{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.xt{flex:1 1 8rem;min-width:0}
.meta2{font-family:var(--mono);font-size:.8rem;color:var(--muted);margin-top:4px}
.nav{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;flex:0 1 22rem;width:100%;max-width:22rem}
.nb{display:grid;place-items:center;height:2rem;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;font-family:var(--mono);font-size:.78rem;padding:0}
button.nb:hover{border-color:var(--accent)}
.nb.dn{background:var(--accent-soft);border-color:var(--accent)}
.nb.cur{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.nb.ok{background:var(--ok-bg);border-color:var(--ok)}
.nb.bad{background:var(--bad-bg);border-color:var(--bad)}
.nav.res{max-width:none;flex:none}
.hint{font-size:.9rem;color:var(--muted)}
.rev details{border-top:1px solid var(--line);padding:10px 0}
.rev summary{cursor:pointer;overflow-wrap:anywhere}
.rev p{margin:8px 0 0;font-size:.95rem;overflow-wrap:anywhere}
.okc{color:var(--ok)}.badc{color:var(--bad)}
@media (prefers-reduced-motion:reduce){.prog>i{transition:none}}
.expl{margin:.5rem 0 0;padding:.55rem .75rem;border-radius:8px;font-size:.92rem;line-height:1.45;border-left:3px solid}.exb{background:rgba(220,60,60,.1);border-color:#d94f4f}.exg{background:rgba(40,160,90,.1);border-color:#2f9e5f}
</style>

<div class="wrap">
  <div>
    <h1>Тест по ПИС</h1>
    <p class="sub">Проектирование информационных систем. Вопросы собраны из лекционного теста и файлов с ответами, правильный вариант подсвечивается после выбора.</p>
  </div>
  <div class="view" id="viewMain">
    <div class="bar" id="setup">
      <label class="f" for="topic">Тема<select id="topic"></select></label>
      <label class="f" for="kind">Тип вопроса<select id="kind">
        <option value="all">Любой</option>
        <option value="single">Один ответ</option>
        <option value="multi">Несколько ответов</option>
        <option value="match">Сопоставление и порядок</option>
        <option value="fig">С рисунком</option>

      <button class="btn" id="go" style="align-self:flex-end">Начать</button>
    </div>
    <div class="examlink"><span class="hint">Имитация экзамена: 20 вопросов по всем темам, ответы показываются в конце.</span><button class="btn ghost" id="exam">Приступить к тестированию</button></div>
    <div id="stage"></div>
  </div>
  <div class="view" id="viewExam" hidden><div id="xstage"></div></div>
</div>

  var q=state.list[state.i],picked=[],right=[];
  var ids=Object.keys(state.sel).map(Number);
  if(q.type==="multi"&&!ids.length)return;
  var allOk=true;
  Array.prototype.forEach.call(stage.querySelectorAll(".opt"),function(b,k){
    var isRight=q.correct.indexOf(state.idx[k])>=0,isSel=!!state.sel[k];
    b.disabled=true;b.classList.remove("sel");
    if(isRight&&isSel)b.classList.add("ok");
    else if(isRight&&!isSel){b.classList.add(q.type==="multi"?"miss":"ok");allOk=false}
    else if(!isRight&&isSel){b.classList.add("bad");allOk=false}
    if(isSel)picked.push(q.opts[state.idx[k]]);
    if(isRight)right.push(q.opts[state.idx[k]]);
    if(q.type==="multi"){var bx=b.querySelector(".box");if(bx&&isRight&&isSel)bx.textContent="✓"}
  });
  var txt=allOk?'Верно':(q.type==="multi"?'Неверно: зелёные верные, жёлтые пропущены, красные лишние':'Неверно, правильный ответ подсвечен');
  var selO=Object.keys(state.sel).map(function(k){return state.idx[+k]});
  finish(allOk,txt,{q:q.q,a:right.join(" • "),mine:picked.join(" • ")||"не выбрано"},allOk?"":explain(q,selO));
}
function checkMatch(){
  if(state.done)return;
  var q=state.list[state.i],allOk=true,mine=[],right=[];
  state.rows.forEach(function(r,i){
    var sel=$("m"+i),v=+sel.value,ok=v===r.a,row=sel.parentNode;
    sel.disabled=true;row.classList.add(ok?"ok":"bad");
    if(!ok){allOk=false;var f=document.createElement("div");f.className="fix";f.textContent="Правильно: "+q.choices[r.a];row.appendChild(f)}
    mine.push(r.l+" → "+(v<0?"—":q.choices[v]));right.push(r.l+" → "+q.choices[r.a]);
  });
  finish(allOk,allOk?'Верно':'Неверно, исправления показаны под строками',{q:q.q,a:right.join("; "),mine:mine.join("; ")},allOk?"":explain(q,null,state.rows.map(function(r,i){return +$("m"+i).value}),state.rows));
}
function result(){
  var n=state.list.length,p=Math.round(state.score/n*100);
  stage.innerHTML='<div class="card"><div class="topic">Результат</div><div class="score">'+state.score+' / '+n+'</div>'+
   '<div class="sub" style="margin:0">'+p+'% правильных ответов</div>'+
   '<div class="row"><button class="btn" id="again">Новый тест</button>'+
   (state.wrong.length?'<button class="btn ghost" id="redo">Повторить ошибки ('+state.wrong.length+')</button>':'')+'</div>'+
   (state.wrong.length?'<h2 class="q" style="font-size:1rem">Разбор ошибок</h2><ul class="wrong">'+state.wrong.map(function(w){
     return '<li>'+esc(w.q)+'<br>Правильно: <b>'+esc(w.a)+'</b><br><span style="color:var(--muted)">Ваш ответ: '+esc(w.mine)+'</span></li>'}).join("")+'</ul>':'')+'</div>';
  $("again").onclick=function(){$("go").onclick()};
  if($("redo"))$("redo").onclick=function(){
    var set={};state.wrong.forEach(function(w){set[w.q]=1});
    start(shuffle(Q.filter(function(q){return set[q.q]})));
  };
}
document.addEventListener("keydown",function(e){
  if(!state||state.i>=state.list.length||!$("viewExam").hidden)return;
  var tag=e.target.tagName;
  if(tag==="SELECT"||tag==="INPUT")return;
  var q=state.list[state.i];
  if(e.key==="Enter"&&!state.done&&q.type!=="single"&&tag!=="BUTTON"){var c=$("chk");if(c)c.click();return}
  if(state.done||q.type==="match")return;
  var n={"1":0,"2":1,"3":2,"4":3,"5":4,"6":5,"7":6,"a":0,"b":1,"c":2,"d":3,"e":4,"f":5,"g":6}[e.key.toLowerCase()];
  if(n===undefined)return;
  var btns=stage.querySelectorAll(".opt");
  if(n<btns.length)btns[n].click();
});

/* ===== Режим «Экзамен»: 20 вопросов по всем темам, свободная навигация, ответы без подсказок ===== */
var EX=null,xstage=$("xstage");
function showView(v){$("viewMain").hidden=v!=="main";$("viewExam").hidden=v!=="exam";window.scrollTo(0,0)}
function examIntro(){
  EX=null;showView("exam");
  xstage.innerHTML='<div class="card"><div class="topic">Тестирование</div><h2 class="q">Имитация экзамена: 20 вопросов по всем темам</h2>'+
    '<ul class="rules"><li>Между вопросами можно переходить кнопками с номерами в правом верхнем углу.</li>'+
    '<li>Выберите ответ и нажмите «К следующему вопросу». Верные ответы во время теста не показываются.</li>'+
    '<li>Когда на все вопросы есть ответы, появится кнопка «Завершить тестирование».</li>'+
    '<li>Вопросы бывают с одним и несколькими ответами, на сопоставление и порядок, с рисунком.</li></ul>'+
    '<div class="row"><button class="btn" id="xstart">Начать тестирование</button><button class="btn ghost" id="xhome">Назад к тренировке</button></div></div>';
  $("xstart").onclick=startExam;$("xhome").onclick=function(){showView("main")};
}
function pickExam(){
  var by={};Q.forEach(function(q){(by[q.t]=by[q.t]||[]).push(q)});
  var tops=shuffle(Object.keys(by)).map(function(k){return shuffle(by[k])});
  var out=[];
  while(out.length<20&&tops.some(function(a){return a.length})){
    tops.forEach(function(a){if(out.length<20&&a.length)out.push(a.shift())});
  }
  return shuffle(out);
}
function startExam(){
  var list=pickExam().map(function(q){
    var e={q:q};
    if(q.type==="match"){e.rows=q.order?shuffle(q.rows):q.rows.slice();e.vals=e.rows.map(function(){return -1})}
    else{e.idx=shuffle(q.opts.map(function(_,i){return i}));e.sel=[]}
    return e});
  EX={list:list,cur:0,done:false,confirm:false};
  showView("exam");renderExam();
  window.scrollTo(0,0);
}
function answered(e){return e.q.type==="match"?e.vals.every(function(v){return v>=0}):e.sel.length>0}
function gradeEx(e){
  var q=e.q,ok,mine,right;
  if(q.type==="match"){
    ok=e.rows.every(function(r,i){return e.vals[i]===r.a});
    mine=e.rows.map(function(r,i){return r.l+" → "+(e.vals[i]<0?"—":q.choices[e.vals[i]])}).join("; ");
    right=e.rows.map(function(r){return r.l+" → "+q.choices[r.a]}).join("; ");
  }else{
    var a=e.sel.slice().sort().join(","),b=q.correct.slice().sort().join(",");
    ok=a===b;
    mine=e.sel.length?e.sel.slice().sort(function(x,y){return x-y}).map(function(i){return q.opts[i]}).join(" • "):"нет ответа";
    right=q.correct.map(function(i){return q.opts[i]}).join(" • ");
  }
  return {ok:ok,mine:mine,right:right,ex:ok?"":(q.type==="match"?explain(q,null,e.vals,e.rows):explain(q,e.sel.slice()))};
}
function renderExam(){
  if(EX.done)return examResult();
  var e=EX.list[EX.cur],q=e.q;
  var body='<div class="xhead"><div class="xt"><div class="topic">Экзамен</div><div class="meta2" id="xmeta"></div></div>'+
    '<div class="nav" id="xnav" role="group" aria-label="Переход к вопросу"></div></div>'+
    '<div class="card"><div class="tags"><span class="topic">'+esc(TOPICS[q.t])+'</span><span class="type">'+KIND_LABEL[q.kind||q.type]+'</span></div>'+
    '<h2 class="q">'+esc(q.q)+'</h2>'+(q.fig?'<div class="fig">'+q.fig+'</div>':'')+(q.figimg?'<div class="fig raster">'+q.figimg+'</div>':'');
  if(q.type==="match"){
    body+='<div class="rows">'+e.rows.map(function(r,i){
      return '<div class="mrow"><span class="l">'+esc(r.l)+'</span><select id="xm'+i+'" aria-label="'+esc(r.l)+'"><option value="-1">Выберите…</option>'+
        q.choices.map(function(c,j){return '<option value="'+j+'"'+(e.vals[i]===j?' selected':'')+'>'+esc(c)+'</option>'}).join("")+'</select></div>'}).join("")+'</div>';
  }else{
    body+='<div class="opts" role="group" aria-label="Варианты ответа">'+e.idx.map(function(oi,k){
      var s=e.sel.indexOf(oi)>=0;
      return '<button class="opt'+(s?' sel':'')+'" data-oi="'+oi+'" aria-pressed="'+s+'">'+(q.type==="multi"?'<span class="box" aria-hidden="true">'+(s?'✓':'')+'</span>':'<span class="k">'+"ABCDEFG"[k]+'</span>')+'<span class="t">'+esc(q.opts[oi])+'</span></button>'}).join("")+'</div>';
  }
  body+='<div class="foot" id="xfoot"></div></div>';
  xstage.innerHTML=body;
  if(q.type==="match"){
    e.rows.forEach(function(r,i){$("xm"+i).onchange=function(){e.vals[i]=+this.value;xChrome()}});
  }else{
    Array.prototype.forEach.call(xstage.querySelectorAll(".opt"),function(b){b.onclick=function(){
      var oi=+b.dataset.oi,at=e.sel.indexOf(oi);
      if(q.type==="single"){e.sel=[oi]}else{if(at>=0)e.sel.splice(at,1);else e.sel.push(oi)}
      Array.prototype.forEach.call(xstage.querySelectorAll(".opt"),function(o){
        var on=e.sel.indexOf(+o.dataset.oi)>=0;o.classList.toggle("sel",on);o.setAttribute("aria-pressed",on);
        var bx=o.querySelector(".box");if(bx)bx.textContent=on?"✓":"";
      });
      xChrome();
    }});
  }
  xChrome();
}
function xChrome(){
  var n=EX.list.length,e=EX.list[EX.cur];
  var cnt=EX.list.filter(answered).length;
  $("xmeta").innerHTML='Вопрос '+(EX.cur+1)+' из '+n+'<br>Отвечено: '+cnt+' из '+n;
  $("xnav").innerHTML=EX.list.map(function(x,i){
    var a=answered(x);
    return '<button class="nb'+(i===EX.cur?' cur':'')+(a?' dn':'')+'" data-i="'+i+'" aria-label="Вопрос '+(i+1)+(a?', ответ дан':', без ответа')+'"'+(i===EX.cur?' aria-current="step"':'')+'>'+(i+1)+'</button>'}).join("");
  Array.prototype.forEach.call($("xnav").querySelectorAll(".nb"),function(b){b.onclick=function(){EX.cur=+b.dataset.i;EX.confirm=false;renderExam();window.scrollTo(0,0)}});
  var ok=answered(e);
  var others=EX.list.every(function(x,i){return i===EX.cur||answered(x)});
  var label,act;
  if(others){label="Завершить тестирование";act="finish"}
  else if(EX.cur<n-1){label="К следующему вопросу";act="next"}
  else{label="К неотвеченному вопросу";act="jump"}
  var left=EX.confirm?
    '<span class="verdict bad">Без ответа: '+(n-cnt)+'. Завершить сейчас?</span>':
    '<span class="hint">'+(ok?'Ответ сохранён, его можно изменить.':'Выберите ответ, чтобы перейти дальше.')+'</span>';
  var right=EX.confirm?
    '<div class="row"><button class="btn ghost" id="xno">Продолжить</button><button class="btn" id="xyes">Завершить</button></div>':
    '<div class="row">'+(others?'':'<button class="btn ghost" id="xearly">Завершить досрочно</button>')+'<button class="btn" id="xgo"'+(ok?'':' disabled')+'>'+label+'</button></div>';
  $("xfoot").innerHTML=left+right;
  if(EX.confirm){$("xno").onclick=function(){EX.confirm=false;xChrome()};$("xyes").onclick=finishExam}
  else{
    if($("xearly"))$("xearly").onclick=function(){EX.confirm=true;xChrome()};
    $("xgo").onclick=function(){
      if(act==="finish")return finishExam();
      if(act==="next")EX.cur++;
      else EX.cur=EX.list.findIndex(function(x){return !answered(x)});
      renderExam();window.scrollTo(0,0);
    };
  }
}
function finishExam(){EX.done=true;renderExam();window.scrollTo(0,0)}
function examResult(){
  var g=EX.list.map(gradeEx),score=g.filter(function(x){return x.ok}).length,n=EX.list.length;
  var blank=EX.list.filter(function(e){return !answered(e)}).length;
  xstage.innerHTML='<div class="card"><div class="topic">Результат экзамена</div><div class="score">'+score+' / '+n+'</div>'+
    '<div class="sub" style="margin:0">'+Math.round(score/n*100)+'% правильных ответов'+(blank?', без ответа: '+blank:'')+'</div>'+
    '<div class="nav res" aria-label="Итог по вопросам">'+g.map(function(x,i){return '<span class="nb '+(x.ok?'ok':'bad')+'">'+(i+1)+'</span>'}).join("")+'</div>'+
    '<div class="row"><button class="btn" id="xnew">Новый экзамен</button><button class="btn ghost" id="xback">К тренировке</button></div>'+
    '<h2 class="q" style="font-size:1rem">Разбор вопросов</h2><div class="rev">'+EX.list.map(function(e,i){
      var x=g[i];
      return '<details'+(x.ok?'':' open')+'><summary><b class="'+(x.ok?'okc':'badc')+'">'+(i+1)+'. '+(x.ok?'Верно':'Неверно')+'</b> '+esc(e.q.q)+'</summary>'+
        '<p>Ваш ответ: '+esc(x.mine)+'</p>'+(x.ok?'':'<p>Правильно: <b class="okc">'+esc(x.right)+'</b></p>'+x.ex)+(e.q.note?'<p class="note">'+esc(e.q.note)+'</p>':'')+'</details>'}).join("")+'</div></div>';
  $("xnew").onclick=startExam;
  $("xback").onclick=function(){EX=null;xstage.innerHTML="";showView("main")};
}
$("exam").onclick=examIntro;

$("go").onclick();
</script>

</body></html>
